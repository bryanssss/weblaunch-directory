<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebLaunch Secret Generator</title><style>body{font-family:system-ui;max-width:760px;margin:50px auto;padding:20px;background:#07111f;color:#f4f8fb}section{background:#11243c;border-radius:18px;padding:24px;margin:18px 0}code{display:block;overflow-wrap:anywhere;padding:14px;background:#06101d;border-radius:10px;color:#9af26f}button{padding:12px 18px;border:0;border-radius:10px;font-weight:700;background:#5ce1c8;color:#041510;cursor:pointer}.note{color:#a9b9c9}</style></head><body><h1>WebLaunch secret generator</h1><p class="note">This page works completely inside your browser. It does not send the generated values anywhere.</p><section><h2>ADMIN_KEY</h2><code id="admin"></code><button data-copy="admin">Copy ADMIN_KEY</button></section><section><h2>IP_HASH_SALT</h2><code id="salt"></code><button data-copy="salt">Copy IP_HASH_SALT</button></section><button id="again">Generate new secrets</button><script>function secret(){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}function generate(){admin.textContent=secret();salt.textContent=secret()}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy '+b.dataset.copy.toUpperCase(),1200)});again.onclick=generate;generate()</script></body></html>
